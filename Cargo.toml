[package]
name = "sc0utr"
version = "0.1.0"
edition = "2021"
authors = ["grimh3xx"]
description = "Agregador de recon para pentest autorizado: DNS, subdomínios, portas e whois com saída JSON."
license = "MIT"
repository = "https://github.com/grimh3xx/sc0utr"
keywords = ["pentest", "recon", "dns", "osint", "subdomain"]

[[bin]]
name = "sc0utr"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "net", "macros", "time", "io-util", "sync"] }
clap = { version = "4.5", features = ["derive"] }
hickory-resolver = "0.24"
hickory-proto = "0.24"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
